<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Team</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <!--Logo  -->
        <div class="logo">
            <img src="Unranked logo.svg" alt="Logo">
            <h1>Our Team</h1>
          </div>

          <!-- Navbar -->

          <nav>
            <ul class="nav-menu">
              <li><a href="index.html">Home</a></li>
              <li><a href="program.html">Our Program</a></li>
              <li><a href="team.html">Our Team</a></li>
            </ul> 
          </nav>
        </header>
        <!-- Elegibility -->
         <form id="elegibility">
          <input type="text" placeholder="Child's Name" required>
          <input type="number" placeholder="Age" required>
         

          <!-- skill level -->
          <select id="skilllevel" required>
            <option value="">Skill level</option>
            <option value="beginner">Beginner</option>
            <option value="intermidiate">Intermidiate</option>
            <option value="elite">Elite</option>
        </select>
        <!-- gender -->
        <select id="gender" required>
          <option value="">Select gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
      </select>
      <button type="submit">Check Elegibility</button>
         </form>
        <!-- footer -->
    <footer>
        <p>© Unranked Program</p>
      </footer>
      
    <script src="script.js"></script>
</body>
</html>
