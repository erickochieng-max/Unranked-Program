<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>

        <!--Logo  -->
        <div class="logo">
            <img src="Unranked logo.svg" alt="Logo">
            <h1>Contact Us</h1>
          </div>

          <!-- Navbar -->
          <nav>
            <ul class="nav-menu">
              <li><a href="index.html">Home</a></li>
              <li><a href="program.html">Our Program</a></li>
              <li><a href="contact.html">Contact Us</a></li>
            </ul> 
          </nav>
        </header>

        <!-- Contact -->
 
<section class="contact">
    <h2>Get In Touch</h2>
    <p>We offer the best service to help your child</p>
    <div class="contact-container">

<!-- Contact info -->

        <div class="contact-info">
            <p><strong>Email:</strong> unrankedprogram@gmail.com</p>
            <p><strong>Phone:</strong> +254 720075155</p>
            <p><strong>Location:</strong> Nairobi, Kenya</p>
          </div>

<!-- Contact form -->

          <form class="contact-form">
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea placeholder="Your Message" rows="5" required></textarea>
            <button type="submit">Send Message</button>
          </form>
        </div>
</section>

<!-- Elegibility -->
        <div class="holder">
       
         <form id=" elegibility-form">
          <!-- Name -->
          <label>Child's name:</label>
          <input type="text" placeholder="Name" required>

          <!-- Age -->
          <label>Age:</label>
          <input type="number" placeholder="Age" required>
         

          <!-- skill level -->
          <label>Skill Level:</label>

          <select id="skilllevel" required>
            <option value="">Skill level</option>
            <option value="beginner">Beginner</option>
            <option value="intermidiate">Intermidiate</option>
            <option value="elite">Elite</option>
        </select>

        <!-- gender -->

        <label>Gender:</label>

        <select id="gender" required>
          <option value="">Select gender</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
      </select>
      <button type="submit">Check Elegibility</button>

         </form>
        </div>

        <!-- footer -->
    <footer>
        <p>© Unranked Program</p>
      </footer>
      
    <script src="script.js"></script>
</body>
</html>
